apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voting-app
  labels:
    app: db
  name: db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true      
      containers:
        - image: postgres:15-alpine
          name: postgres

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD

          ports:
            - containerPort: 5432
              name: postgres

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data

      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
